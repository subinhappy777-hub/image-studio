<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>짤·카드 스튜디오</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-wrapper">
  <div class="app-container">
    
    <!-- 상단 툴바 -->
    <div class="toolbar">
      <button class="tool-btn active" data-tool="select" title="선택/이동">↖️</button>
      <button class="tool-btn" data-tool="text" title="텍스트 추가">T</button>
      <button class="tool-btn" data-tool="draw" title="그림 그리기">🖌️</button>
      <button class="tool-btn" data-tool="crop" title="화면비">⛶</button>
      <button class="tool-btn" data-tool="background" title="배경 설정">🖼️</button>
      <button class="tool-btn" data-tool="undo" title="실행 취소">↩️</button>
    </div>

    <!-- 중앙 뷰어 영역 -->
    <main class="viewer-area">
      <div class="canvas-container" id="canvasContainer">
        <div id="uploadPlaceholder" class="upload-placeholder">
          <div class="upload-icon">📁</div>
          <p>클릭하여 이미지를 업로드하세요</p>
        </div>
        <canvas id="canvas" width="720" height="720"></canvas>
        <input type="text" id="inlineTextInput" class="inline-text-input" />
      </div>

      <div class="zoom-controls">
        <button id="zoomInBtn" title="확대">➕</button>
        <button id="zoomOutBtn" title="축소">➖</button>
      </div>
    </main>

    <!-- 하단 편집 옵션 패널 -->
    <div class="option-panel" id="optionPanel">
      <div id="opt-select" class="opt-content active">
        <span class="hint">스티커나 텍스트를 선택하고 드래그하세요.</span>
      </div>
      
      <div id="opt-text" class="opt-content">
        <div class="row">
          <select id="fontFamily">
            <option value="system-ui, sans-serif">기본 고딕</option>
            <option value="'Georgia', serif">조지아</option>
            <option value="'Impact', sans-serif">Impact</option>
          </select>
          <input id="colorInput" type="color" value="#ffffff" title="색상" />
          <input id="fontSize" type="range" min="16" max="120" value="48" title="크기" />
        </div>
      </div>

      <div id="opt-draw" class="opt-content">
        <div class="row">
          <select id="brushType">
            <option value="pen">펜</option>
            <option value="neon">네온</option>
            <option value="highlighter">형광펜</option>
            <option value="glitter">글리터</option>
          </select>
          <input id="brushColor" type="color" value="#ff5c6c" title="펜 색상" />
          <input id="brushSize" type="range" min="1" max="50" value="8" title="굵기" />
        </div>
      </div>

      <div id="opt-crop" class="opt-content">
        <div class="row">
          <select id="aspectRatio">
            <option value="1:1">1:1 정사각형</option>
            <option value="4:5">4:5 세로형</option>
            <option value="9:16">9:16 스토리</option>
          </select>
        </div>
      </div>

      <div id="opt-background" class="opt-content">
        <div class="row">
          <input type="color" id="bgColor" value="#1e1e24" title="배경 색상" />
          <span class="hint">배경 색상을 지정하거나 INPUT으로 이미지를 변경하세요.</span>
        </div>
      </div>
    </div>

    <!-- 하단 메인 액션 버튼 -->
    <div class="bottom-actions">
      <button id="btnInput" class="action-btn input-btn">
        <span class="icon">📂</span> INPUT
      </button>
      <button id="btnSave" class="action-btn save-btn">
        <span class="icon">💾</span> SAVE
      </button>
      <button id="btnOutput" class="action-btn output-btn">
        <span class="icon">📤</span> OUTPUT
      </button>
      <input id="fileInput" type="file" accept="image/png,image/jpeg" hidden />
    </div>

  </div>
</div>

<!-- 템플릿 모달 -->
<div id="templateModal" class="modal">
  <div class="modal-content">
    <h3>저장된 템플릿</h3>
    <ul id="templateList"></ul>
    <button id="closeModalBtn" class="close-btn">닫기</button>
  </div>
</div>

<div id="fileMsg" class="msg"></div>

<!-- 모듈 스크립트로 연결 -->
<script type="module" src="js/main.js"></script>
</body>
</html>
