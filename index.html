<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>짤·카드 스튜디오 — 프로 에디터</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header>
  <h1>짤·카드 스튜디오</h1>
  <span class="sub">다양한 기능으로 나만의 카드를 만들어보세요</span>
</header>

<div class="layout">
  <!-- 좌측: 편집 도구 -->
  <aside class="panel">
    <!-- 탭 메뉴 -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="tab-basic">기본</button>
      <button class="tab-btn" data-tab="tab-text">폰트</button>
      <button class="tab-btn" data-tab="tab-sticker">스티커</button>
      <button class="tab-btn" data-tab="tab-draw">그리기</button>
    </div>

    <!-- 탭 1: 기본 (이미지, 화면비) -->
    <div id="tab-basic" class="tab-content active">
      <h2>1. 이미지</h2>
      <div class="field">
        <label class="drop" id="dropZone" for="fileInput">
          클릭하거나 PNG·JPEG 파일을 선택하세요
        </label>
        <input id="fileInput" type="file" accept="image/png,image/jpeg" hidden />
        <div class="msg" id="fileMsg" role="status" aria-live="polite"></div>
      </div>
      <h2>2. 화면비</h2>
      <div class="field">
        <select id="aspectRatio">
          <option value="1:1">1:1 (정사각형)</option>
          <option value="4:5">4:5 (인스타그램 세로)</option>
          <option value="9:16">9:16 (릴스/스토리)</option>
        </select>
      </div>
      <div class="badge" id="stateBadge">작업 없음</div>
    </div>

    <!-- 탭 2: 폰트 설정 -->
    <div id="tab-text" class="tab-content">
      <h2>문구 입력</h2>
      <div class="field">
        <textarea id="textInput" rows="3" placeholder="문구를 입력하세요">가장자리 테스트 🎉
줄바꿈과 이모지 😊 혼합</textarea>
      </div>
      
      <h2>폰트 스타일</h2>
      <div class="field">
        <label for="fontFamily">글꼴</label>
        <select id="fontFamily">
          <option value="system-ui, 'Malgun Gothic', sans-serif">기본 고딕</option>
          <option value="'Georgia', serif">조지아 (명조풍)</option>
          <option value="'Courier New', monospace">Courier (타자기)</option>
          <option value="'Impact', sans-serif">Impact (굵은 제목)</option>
          <option value="'Comic Sans MS', cursive">Comic Sans (캐주얼)</option>
        </select>
      </div>
      
      <div class="field">
        <label>크기 <span id="fontSizeVal" class="val">48</span></label>
        <input id="fontSize" type="range" min="12" max="160" value="48" />
      </div>
      <div class="field">
        <label>색상</label>
        <input id="colorInput" type="color" value="#ffffff" />
      </div>
      <div class="field row">
        <div style="flex:1">
          <label>X 위치 <span id="posXVal" class="val">50</span></label>
          <input id="posX" type="range" min="0" max="100" value="50" />
        </div>
        <div style="flex:1">
          <label>Y 위치 <span id="posYVal" class="val">50</span></label>
          <input id="posY" type="range" min="0" max="100" value="50" />
        </div>
      </div>
    </div>

    <!-- 탭 3: 이모지 스티커 -->
    <div id="tab-sticker" class="tab-content">
      <h2>이모지 스티커</h2>
      <p class="hint" style="margin-bottom: 8px;">클릭하여 캔버스에 추가하세요 (드래그로 이동 가능)</p>
      <div class="sticker-grid" id="stickerGrid">
        <!-- JS에서 렌더링 -->
      </div>
      <div class="field" style="margin-top: 16px;">
        <button id="clearStickersBtn" class="btn-secondary" style="width:100%;">모든 스티커 지우기</button>
      </div>
    </div>

    <!-- 탭 4: 그리기 -->
    <div id="tab-draw" class="tab-content">
      <h2>그림 그리기</h2>
      <div class="field">
        <label>브러시 색상</label>
        <input id="brushColor" type="color" value="#ff5c6c" />
      </div>
      <div class="field">
        <label>브러시 굵기 <span id="brushSizeVal" class="val">5</span></label>
        <input id="brushSize" type="range" min="1" max="50" value="5" />
      </div>
      <div class="field">
        <button id="clearDrawBtn" class="btn-secondary" style="width:100%;">그리기 모두 지우기</button>
      </div>
    </div>

    <!-- 다운로드 버튼 (항상 보임) -->
    <div class="field" style="margin-top: 24px; border-top: 1px solid var(--line); padding-top: 16px;">
      <button id="downloadBtn" class="btn-primary">이미지 다운로드 (PNG)</button>
    </div>
  </aside>

  <!-- 우측: 미리보기 + 템플릿 -->
  <section class="stage">
    <div class="row" style="justify-content:space-between;">
      <strong style="font-size:14px;">미리보기</strong>
      <span class="hint" id="metaInfo">이미지를 불러오면 정보가 표시됩니다</span>
    </div>
    
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="canvas" width="720" height="720" aria-label="문구와 이미지 미리보기"></canvas>
    </div>
    
    <!-- 템플릿 관리 패널 -->
    <div style="border-top: 1px solid var(--line); padding-top: 16px; margin-top: 8px;">
      <div class="row" style="justify-content:space-between; margin-bottom: 12px;">
        <strong style="font-size:14px;">나의 템플릿</strong>
        <div style="display:flex; gap: 6px; flex-wrap: wrap;">
          <button id="saveTemplateBtn" class="btn-small">+ 현재 상태 저장</button>
          <button id="exportJsonBtn" class="btn-small">JSON 내보내기</button>
          <button id="importJsonBtn" class="btn-small">JSON 가져오기</button>
          <input type="file" id="jsonFileInput" accept=".json" hidden />
        </div>
      </div>
      <div id="jsonMsg" class="msg" style="margin-bottom: 8px;"></div>
      <ul id="templateList" class="template-list">
        <!-- JS에서 렌더링 -->
      </ul>
    </div>
  </section>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
