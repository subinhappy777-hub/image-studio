<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>짤·카드 스튜디오</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-container">
  <!-- 1. 상단 타이틀 -->
  <header class="app-header">
    <h1>짤·카드 스튜디오</h1>
  </header>

  <!-- 2. 툴바 (편집 도구 선택) -->
  <div class="toolbar">
    <button class="tool-btn active" data-tool="image">🖼️ 사진</button>
    <button class="tool-btn" data-tool="text">📝 텍스트</button>
    <button class="tool-btn" data-tool="sticker">✨ 스티커</button>
    <button class="tool-btn" data-tool="draw">🖍️ 그리기</button>
  </div>

  <!-- 3. 중앙 메인 뷰어 -->
  <main class="viewer-area">
    <div class="canvas-container">
      <!-- 캔버스 -->
      <canvas id="canvas" width="720" height="720"></canvas>
      <!-- 캔버스 조작을 위한 오버레이 (선택용) -->
      <div id="canvasOverlay" class="canvas-overlay"></div>
    </div>
    <div id="fileMsg" class="msg"></div>
  </main>

  <!-- 4. 하단 편집 패널 (툴바 선택에 따라 내용 변경) -->
  <div class="control-panel">
    
    <!-- 사진/화면비 설정 -->
    <div id="panel-image" class="panel-content active">
      <div class="row">
        <button id="uploadBtn" class="action-btn">사진 선택하기</button>
        <input id="fileInput" type="file" accept="image/png,image/jpeg" hidden />
        <select id="aspectRatio">
          <option value="1:1">1:1 정사각형</option>
          <option value="4:5">4:5 세로형</option>
          <option value="9:16">9:16 스토리</option>
        </select>
      </div>
    </div>

    <!-- 텍스트 설정 -->
    <div id="panel-text" class="panel-content">
      <textarea id="textInput" rows="2" placeholder="문구를 입력하세요">여기에 문구를 입력하세요 🎉</textarea>
      <div class="row" style="margin-top: 8px;">
        <select id="fontFamily">
          <option value="system-ui, sans-serif">기본 고딕</option>
          <option value="'Georgia', serif">조지아</option>
          <option value="'Impact', sans-serif">Impact</option>
        </select>
        <input id="colorInput" type="color" value="#ffffff" title="텍스트 색상" />
        <input id="fontSize" type="range" min="12" max="120" value="48" />
      </div>
    </div>

    <!-- 스티커 설정 -->
    <div id="panel-sticker" class="panel-content">
      <div class="sticker-grid" id="stickerGrid"></div>
      <div class="row" style="margin-top: 8px;">
        <span id="selectedEmojiDisplay">선택된 스티커: 없음</span>
        <button id="clearStickersBtn" class="action-btn" style="margin-left: auto;">모두 지우기</button>
      </div>
    </div>

    <!-- 그리기 설정 -->
    <div id="panel-draw" class="panel-content">
      <div class="row">
        <select id="brushType">
          <option value="pen">기본 펜</option>
          <option value="neon">네온</option>
          <option value="highlighter">형광펜</option>
          <option value="glitter">글리터</option>
        </select>
        <input id="brushColor" type="color" value="#ff5c6c" title="펜 색상" />
        <input id="brushSize" type="range" min="1" max="50" value="8" />
        <button id="undoDrawBtn" class="action-btn">실행 취소</button>
      </div>
    </div>
  </div>

  <!-- 5. 하단 액션 (Input, Save, Output) -->
  <div class="bottom-actions">
    <!-- Input: 사진 선택 -->
    <button id="btnInput" class="btn-bottom btn-input">
      <span class="icon">📂</span>
      <span>Input</span>
    </button>
    <!-- Save: 템플릿 저장 (메모리) -->
    <button id="btnSave" class="btn-bottom btn-save">
      <span class="icon">💾</span>
      <span>Save</span>
    </button>
    <!-- Output: 파일로 다운로드 -->
    <button id="btnOutput" class="btn-bottom btn-output">
      <span class="icon">📤</span>
      <span>Output</span>
    </button>
  </div>

  <!-- 템플릿 목록 (하단 Save 버튼 아래에 토글 형태로 표시) -->
  <div id="templateListContainer" class="template-container">
    <div class="row" style="justify-content: space-between; margin-bottom: 8px;">
      <strong>저장된 템플릿 (메모리)</strong>
      <div style="display:flex; gap: 4px;">
        <button id="exportJsonBtn" class="mini-btn">JSON 내보내기</button>
        <button id="importJsonBtn" class="mini-btn">가져오기</button>
        <input type="file" id="jsonFileInput" accept=".json" hidden />
      </div>
    </div>
    <ul id="templateList"></ul>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
